kind = "web"
previewPath = "/site/"
title = "ProductArmor Website"
version = "1.0.0"
id = "artifacts/productarmor-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/site/" ]
localPort = 23795

[services.development]
run = "pnpm --filter @workspace/productarmor-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/productarmor-site", "run", "build" ]
publicDir = "artifacts/productarmor-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23795"
BASE_PATH = "/site/"
